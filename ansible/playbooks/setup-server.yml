---
- name: Setup Azure VM for Task Manager Application
  hosts: app_servers
  become: yes
  gather_facts: yes
  
  vars:
    app_user: azureuser
    app_dir: /home/{{ app_user }}/app
    docker_compose_version: "2.23.0"
    
  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"
    
    - name: Display system information
      debug:
        msg: |
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          Hostname: {{ ansible_hostname }}
          IP: {{ ansible_default_ipv4.address }}
          Memory: {{ ansible_memtotal_mb }} MB
          CPUs: {{ ansible_processor_vcpus }}
  
  tasks:
    # ===== Install Docker =====
    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
          - git
        state: present
    
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
    
    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
    
    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
    
    - name: Install Docker SDK for Python
      pip:
        name:
          - docker
          - docker-compose
        state: present
    
    - name: Add user to docker group
      user:
        name: "{{ app_user }}"
        groups: docker
        append: yes
    
    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes
    
    # ===== Configure Azure Container Registry =====
    - name: Log in to Azure Container Registry
      community.docker.docker_login:
        registry_url: "{{ lookup('env', 'ACR_LOGIN_SERVER') }}"
        username: "{{ lookup('env', 'ARM_CLIENT_ID') }}"
        password: "{{ lookup('env', 'ARM_CLIENT_SECRET') }}"
        reauthorize: yes
      when: lookup('env', 'ACR_LOGIN_SERVER') != ''
    
    # ===== Setup Application Directory =====
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'
    
    - name: Create docker-compose.yml
      copy:
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0644'
        content: |
          version: '3.8'
          
          services:
            postgres:
              image: postgres:15-alpine
              container_name: taskmanager-db
              restart: unless-stopped
              environment:
                POSTGRES_USER: {{ lookup('env', 'DB_USER') | default('devops', true) }}
                POSTGRES_PASSWORD: {{ lookup('env', 'DB_PASSWORD') | default('devops123', true) }}
                POSTGRES_DB: {{ lookup('env', 'DB_NAME') | default('devops_app', true) }}
              volumes:
                - postgres_data:/var/lib/postgresql/data
              ports:
                - "5432:5432"
              networks:
                - app-network
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U {{ lookup('env', 'DB_USER') | default('devops', true) }}"]
                interval: 10s
                timeout: 5s
                retries: 5
          
            backend:
              image: {{ lookup('env', 'ACR_LOGIN_SERVER') }}/devops-backend:{{ lookup('env', 'IMAGE_TAG') | default('latest', true) }}
              container_name: taskmanager-backend
              restart: unless-stopped
              environment:
                NODE_ENV: production
                PORT: 3000
                DATABASE_URL: postgresql://{{ lookup('env', 'DB_USER') | default('devops', true) }}:{{ lookup('env', 'DB_PASSWORD') | default('devops123', true) }}@postgres:5432/{{ lookup('env', 'DB_NAME') | default('devops_app', true) }}
              ports:
                - "3000:3000"
              networks:
                - app-network
              depends_on:
                postgres:
                  condition: service_healthy
              healthcheck:
                test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 40s
          
            frontend:
              image: {{ lookup('env', 'ACR_LOGIN_SERVER') }}/devops-frontend:{{ lookup('env', 'IMAGE_TAG') | default('latest', true) }}
              container_name: taskmanager-frontend
              restart: unless-stopped
              environment:
                VITE_API_URL: http://{{ ansible_default_ipv4.address }}:3000
              ports:
                - "80:80"
              networks:
                - app-network
              depends_on:
                - backend
          
          networks:
            app-network:
              driver: bridge
          
          volumes:
            postgres_data:
    
    # ===== Deploy Application =====
    - name: Stop existing containers
      community.docker.docker_compose:
        project_src: "{{ app_dir }}"
        state: absent
      ignore_errors: yes
    
    - name: Pull latest images
      community.docker.docker_compose:
        project_src: "{{ app_dir }}"
        pull: yes
      when: lookup('env', 'ACR_LOGIN_SERVER') != ''
    
    - name: Start application containers
      community.docker.docker_compose:
        project_src: "{{ app_dir }}"
        state: present
        recreate: always
    
    - name: Wait for backend to be healthy
      uri:
        url: "http://localhost:3000/health"
        status_code: 200
      register: result
      until: result.status == 200
      retries: 30
      delay: 10
      ignore_errors: yes
    
    - name: Wait for frontend to be accessible
      uri:
        url: "http://localhost:80"
        status_code: 200
      register: frontend_result
      until: frontend_result.status == 200
      retries: 10
      delay: 5
      ignore_errors: yes
    
    # ===== Configure Firewall =====
    - name: Install UFW
      apt:
        name: ufw
        state: present
    
    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp
    
    - name: Allow HTTP
      community.general.ufw:
        rule: allow
        port: '80'
        proto: tcp
    
    - name: Allow Backend API
      community.general.ufw:
        rule: allow
        port: '3000'
        proto: tcp
    
    - name: Enable UFW
      community.general.ufw:
        state: enabled
    
    # ===== Cleanup =====
    - name: Remove unused Docker images
      community.docker.docker_prune:
        images: yes
        images_filters:
          dangling: false
      ignore_errors: yes
    
    - name: Remove unused Docker volumes
      community.docker.docker_prune:
        volumes: yes
      ignore_errors: yes
  
  post_tasks:
    - name: Display deployment summary
      debug:
        msg: |
          ========================================
          Deployment Complete!
          ========================================
          Frontend URL: http://{{ ansible_default_ipv4.address }}
          Backend API: http://{{ ansible_default_ipv4.address }}:3000
          Health Check: http://{{ ansible_default_ipv4.address }}:3000/health
          ========================================
          
          To check status:
            docker ps
            docker logs taskmanager-backend
            docker logs taskmanager-frontend
          ========================================
