---
- name: Install monitoring tools
  apt:
    name:
      - prometheus-node-exporter
      - sysstat
      - htop
      - iotop
      - nethogs
    state: present

- name: Enable node exporter
  systemd:
    name: prometheus-node-exporter
    state: started
    enabled: yes

- name: Create monitoring scripts directory
  file:
    path: /usr/local/bin/monitoring
    state: directory
    mode: '0755'

- name: Create system status monitoring script
  copy:
    content: |
      #!/bin/bash
      echo "=== System Status Report ==="
      echo "Generated: $(date)"
      echo ""
      echo "=== CPU Usage ==="
      top -bn1 | grep "Cpu(s)" | sed "s/.*, *\([0-9.]*\)%* id.*/\1/" | awk '{print "CPU Usage: " 100 - $1"%"}'
      echo ""
      echo "=== Memory Usage ==="
      free -m | awk 'NR==2{printf "Memory Usage: %s/%sMB (%.2f%%)\n", $3,$2,$3*100/$2 }'
      echo ""
      echo "=== Disk Usage ==="
      df -h | awk '$NF=="/"{printf "Disk Usage: %s\n", $5}'
      df -h / | tail -1
      echo ""
      echo "=== Docker Containers ==="
      docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
      echo ""
      echo "=== Docker Resource Usage ==="
      docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}"
      echo ""
      echo "=== Network Connections ==="
      ss -tunap | grep ESTABLISHED | wc -l | awk '{print "Active Connections: " $1}'
      echo ""
      echo "=== System Uptime ==="
      uptime
    dest: /usr/local/bin/monitoring/system-status.sh
    mode: '0755'

- name: Create Docker health check script
  copy:
    content: |
      #!/bin/bash
      echo "=== Docker Health Check ==="
      echo "Generated: $(date)"
      echo ""
      
      # Check if Docker is running
      if systemctl is-active --quiet docker; then
        echo "✅ Docker service is running"
      else
        echo "❌ Docker service is NOT running"
        exit 1
      fi
      
      # Check container health
      echo ""
      echo "=== Container Health Status ==="
      docker ps --format "{{.Names}}: {{.Status}}" | while read line; do
        if echo "$line" | grep -q "unhealthy"; then
          echo "❌ $line"
        elif echo "$line" | grep -q "healthy\|Up"; then
          echo "✅ $line"
        else
          echo "⚠️  $line"
        fi
      done
      
      # Check for stopped containers
      STOPPED=$(docker ps -a --filter "status=exited" --format "{{.Names}}" | wc -l)
      if [ $STOPPED -gt 0 ]; then
        echo ""
        echo "⚠️  Warning: $STOPPED stopped container(s) found"
        docker ps -a --filter "status=exited" --format "  - {{.Names}} (exited {{.Status}})"
      fi
      
      # Check disk space used by Docker
      echo ""
      echo "=== Docker Disk Usage ==="
      docker system df
    dest: /usr/local/bin/monitoring/docker-health.sh
    mode: '0755'

- name: Create application health check script
  copy:
    content: |
      #!/bin/bash
      echo "=== Application Health Check ==="
      echo "Generated: $(date)"
      echo ""
      
      # Check backend health
      if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
        echo "✅ Backend API is healthy"
        curl -s http://localhost:3000/health | python3 -m json.tool 2>/dev/null || echo "  Response received"
      else
        echo "❌ Backend API is NOT responding"
      fi
      
      echo ""
      
      # Check frontend
      if curl -sf http://localhost:80 > /dev/null 2>&1; then
        echo "✅ Frontend is accessible"
      else
        echo "❌ Frontend is NOT accessible"
      fi
      
      echo ""
      
      # Check database
      if docker exec taskmanager-db pg_isready -U devops > /dev/null 2>&1; then
        echo "✅ Database is ready"
      else
        echo "❌ Database is NOT ready"
      fi
      
      echo ""
      echo "=== Recent Application Logs ==="
      echo "Backend (last 10 lines):"
      docker logs taskmanager-backend --tail 10 2>&1 | grep -E "(error|Error|ERROR)" || echo "  No recent errors"
      echo ""
      echo "Frontend (last 10 lines):"
      docker logs taskmanager-frontend --tail 10 2>&1 | grep -E "(error|Error|ERROR)" || echo "  No recent errors"
    dest: /usr/local/bin/monitoring/app-health.sh
    mode: '0755'

- name: Create monitoring cron job
  cron:
    name: "System health monitoring"
    minute: "*/15"
    job: "/usr/local/bin/monitoring/docker-health.sh >> /var/log/docker-health.log 2>&1"
    user: root

- name: Create log rotation for monitoring logs
  copy:
    content: |
      /var/log/docker-health.log {
        daily
        missingok
        rotate 7
        compress
        notifempty
        create 0644 root root
      }
    dest: /etc/logrotate.d/monitoring
    mode: '0644'

- name: Install Docker container log management
  copy:
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3",
          "labels": "production"
        }
      }
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: Restart Docker
