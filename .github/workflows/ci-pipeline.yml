name: CI Pipeline

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  validate-and-test:
    name: Validate and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install Dependencies
        run: |
          cd ${{ matrix.service }}
          npm ci

      - name: Lint
        run: |
          cd ${{ matrix.service }}
          npm run lint

      - name: Test
        run: |
          cd ${{ matrix.service }}
          npm test
        env:
          # Mock env vars for testing
          DATABASE_URL: postgresql://devops:devops123@localhost:5432/devops_app
          VITE_API_URL: http://localhost:4000

  build-docker:
    name: Build Docker Images
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -f infra/docker/backend.Dockerfile -t taskmanager-backend:${{ github.sha }} .

      - name: Build Frontend Image
        run: docker build -f infra/docker/frontend.Dockerfile -t taskmanager-frontend:${{ github.sha }} .
