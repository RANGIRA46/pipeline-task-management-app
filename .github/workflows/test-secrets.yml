name: Test Secrets Configuration

on:
  workflow_dispatch:

jobs:
  check-secrets:
    name: Verify GitHub Secrets
    runs-on: ubuntu-latest
    
    steps:
      - name: Check ACR Secrets
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔐 Azure Container Registry Secrets"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER != '' && '✅ Configured' || '❌ Missing' }}"
          echo "ACR_NAME: ${{ secrets.ACR_NAME != '' && '✅ Configured' || '❌ Missing' }}"
          echo "ACR_USERNAME: ${{ secrets.ACR_USERNAME != '' && '✅ Configured' || '❌ Missing' }}"
          echo "ACR_PASSWORD: ${{ secrets.ACR_PASSWORD != '' && '✅ Configured' || '❌ Missing' }}"
          echo ""
      
      - name: Check Azure Secrets
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "☁️  Azure Service Principal Secrets"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID != '' && '✅ Configured' || '❌ Missing' }}"
          echo "ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET != '' && '✅ Configured' || '❌ Missing' }}"
          echo "ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID != '' && '✅ Configured' || '❌ Missing' }}"
          echo ""
      
      - name: Check VM Secrets
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🖥️  Virtual Machine Secrets"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "VM_PUBLIC_IP: ${{ secrets.VM_PUBLIC_IP != '' && '✅ Configured' || '❌ Missing' }}"
          echo "SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' && '✅ Configured' || '❌ Missing' }}"
          echo ""
      
      - name: Check Database Secrets
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🗄️  Database Configuration Secrets"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "DB_USER: ${{ secrets.DB_USER != '' && '✅ Configured' || '❌ Missing' }}"
          echo "DB_PASSWORD: ${{ secrets.DB_PASSWORD != '' && '✅ Configured' || '❌ Missing' }}"
          echo "DB_NAME: ${{ secrets.DB_NAME != '' && '✅ Configured' || '❌ Missing' }}"
          echo ""
      
      - name: Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Configuration Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Count configured secrets
          CONFIGURED=0
          TOTAL=12
          
          [ -n "${{ secrets.ACR_LOGIN_SERVER }}" ] && ((CONFIGURED++))
          [ -n "${{ secrets.ACR_NAME }}" ] && ((CONFIGURED++))
          [ -n "${{ secrets.ACR_USERNAME }}" ] && ((CONFIGURED++))
          [ -n "${{ secrets.ACR_PASSWORD }}" ] && ((CONFIGURED++))
          [ -n "${{ secrets.ARM_CLIENT_ID }}" ] && ((CONFIGURED++))
          [ -n "${{ secrets.ARM_CLIENT_SECRET }}" ] && ((CONFIGURED++))
          [ -n "${{ secrets.ARM_TENANT_ID }}" ] && ((CONFIGURED++))
          [ -n "${{ secrets.VM_PUBLIC_IP }}" ] && ((CONFIGURED++))
          [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ] && ((CONFIGURED++))
          [ -n "${{ secrets.DB_USER }}" ] && ((CONFIGURED++))
          [ -n "${{ secrets.DB_PASSWORD }}" ] && ((CONFIGURED++))
          [ -n "${{ secrets.DB_NAME }}" ] && ((CONFIGURED++))
          
          echo "Configured Secrets: $CONFIGURED / $TOTAL"
          echo ""
          
          if [ $CONFIGURED -eq $TOTAL ]; then
            echo "✅ All secrets configured! Ready for deployment."
            echo ""
            echo "Next steps:"
            echo "  1. Push to main branch to trigger CD pipeline"
            echo "  2. Or run 'CD Pipeline' workflow manually"
            echo "  3. Monitor deployment at http://${{ secrets.VM_PUBLIC_IP }}"
            exit 0
          else
            echo "❌ Missing $(($TOTAL - $CONFIGURED)) secret(s). Please configure all secrets."
            echo ""
            echo "See: SECRETS_SETUP.md for configuration guide"
            exit 1
          fi
      
      - name: Test ACR Access (Optional)
        if: secrets.ACR_LOGIN_SERVER != '' && secrets.ACR_USERNAME != '' && secrets.ACR_PASSWORD != ''
        continue-on-error: true
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧪 Testing ACR Authentication"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Test ACR login
          docker login ${{ secrets.ACR_LOGIN_SERVER }} \
            -u ${{ secrets.ACR_USERNAME }} \
            -p ${{ secrets.ACR_PASSWORD }} \
            && echo "✅ ACR authentication successful!" \
            || echo "❌ ACR authentication failed. Check credentials."
